<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save bookmark · Syncly</title>
  <!-- Critical inline CSS for instant first paint without flash -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 450px;
      min-width: 450px;
      height: auto;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow-x: hidden;
      overflow-y: hidden;
      background: #ffffff;
      color: #0f172a;
    }
    html.is-sidepanel, html.is-sidepanel body {
      width: 100% !important;
      min-width: 0 !important;
      min-height: 100% !important;
      height: 100% !important;
      overflow-y: auto !important;
    }
    html[data-color-mode="dark"], html[data-color-mode="dark"] body {
      background: #111215;
      color: #ffffff;
    }
    html[data-color-mode="light"], html[data-color-mode="light"] body {
      background: #ffffff;
      color: #0f172a;
    }
  </style>
  <link rel="stylesheet" href="../../../public/fonts/fonts.css">
  <link rel="stylesheet" href="../shared/styles/tokens.css">
  <link rel="stylesheet" href="../shared/styles/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Main Form View -->
    <div id="main-view" class="popup-view is-active">
      <!-- Top Brand & Domain Header -->
      <header class="popup-header">
        <div class="popup-header-brand">
          <img class="popup-logo" src="../../../public/icons/logo-transparent-white.svg" alt="Syncly" width="20" height="20">
          <span class="popup-brand-name">Syncly</span>
        </div>
        <div class="popup-header-actions">
          <div class="popup-domain-badge" id="popup-domain-badge" title="Current tab domain">
            <img id="popup-favicon" class="popup-favicon" alt="" hidden>
            <span class="popup-domain" id="popup-domain">Saving page...</span>
          </div>
          <button type="button" id="btn-open-sidebar" class="popup-theme-btn" title="Open from sidebar" aria-label="Open from sidebar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
          </button>
          <button type="button" id="btn-theme-toggle" class="popup-theme-btn" title="Toggle theme" aria-label="Toggle theme">
            <span class="theme-icon theme-icon-dark">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            </span>
            <span class="theme-icon theme-icon-light">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
            </span>
          </button>
        </div>
      </header>

      <!-- Segmented Target Destination Switcher (Bookmarks vs Shortcuts vs Collection) -->
      <div class="popup-type-switch" role="tablist">
        <button type="button" class="popup-type-btn is-active" id="type-btn-bookmark" role="tab" aria-selected="true">
          <svg class="popup-type-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          <span>Bookmark</span>
        </button>
        <button type="button" class="popup-type-btn" id="type-btn-shortcut" role="tab" aria-selected="false">
          <svg class="popup-type-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
          <span>Shortcut</span>
        </button>
        <button type="button" class="popup-type-btn" id="type-btn-collection" role="tab" aria-selected="false">
          <svg class="popup-type-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5Z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
          <span>Collection</span>
        </button>
      </div>

      <!-- Already Saved Notification Banner -->
      <div id="popup-existing-banner" class="popup-existing-banner" hidden style="display: none !important;">
        <div class="existing-badge-content">
          <svg class="existing-badge-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Saved in <strong id="existing-folder-name" class="existing-folder-link" title="Click to view folder in Chrome Bookmarks"></strong></span>
        </div>
        <button type="button" id="btn-view-existing-folder" class="existing-badge-btn" title="Open this location in Chrome Bookmarks">
          <span>View location</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
      </div>

      <!-- Bookmark Capture Form -->
      <form id="add-form" class="popup-form">
        <!-- Title Field -->
        <div class="popup-field">
          <label class="popup-field-label" for="bm-title">Page Title</label>
          <div class="popup-input-wrap">
            <input type="text" id="bm-title" class="popup-input popup-input-title" placeholder="Page title" required autocomplete="off">
          </div>
        </div>

        <!-- URL Field -->
        <div class="popup-field">
          <label class="popup-field-label" for="bm-url">URL</label>
          <input type="url" id="bm-url" class="popup-input popup-input-url" placeholder="https://..." required autocomplete="off">
        </div>

        <!-- Destination Folder Selector with Inline Dropdown -->
        <div class="popup-field" id="field-folder">
          <div class="popup-field-header">
            <label class="popup-field-label" for="bm-collection-trigger">Folder Destination</label>
          </div>
          <div class="picker-trigger-box" id="bm-collection">
            <button type="button" class="picker-trigger-btn" id="bm-collection-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="picker-trigger-icon-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h6l2 2.5h10v9.5H3Z"></path></svg>
              </span>
              <span class="picker-trigger-label" id="bm-collection-label">Bookmarks bar</span>
              <svg class="picker-trigger-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <input type="hidden" id="bm-collection-value">

            <!-- Inline Folder Search & List Dropdown -->
            <div class="picker-dropdown-panel" id="folder-dropdown-panel" hidden>
              <div class="picker-dropdown-search-row">
                <svg class="picker-dropdown-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input type="text" class="picker-dropdown-search-input" id="folder-search-input" placeholder="Search folders..." autocomplete="off">
                <button type="button" class="picker-dropdown-search-clear" id="folder-search-clear" hidden aria-label="Clear search">✕</button>
                <button type="button" class="picker-dropdown-add-btn" id="folder-new-btn" title="Create new folder">+ New</button>
              </div>

              <!-- Inline New Folder Creator -->
              <div class="picker-dropdown-creator" id="folder-creator-box" hidden>
                <input type="text" class="picker-dropdown-creator-input" id="folder-creator-input" placeholder="Folder name..." autocomplete="off">
                <button type="button" class="picker-dropdown-creator-confirm" id="folder-creator-confirm">Add</button>
                <button type="button" class="picker-dropdown-creator-cancel" id="folder-creator-cancel">✕</button>
              </div>

              <div class="picker-dropdown-list-wrap">
                <ul class="picker-dropdown-list" id="folder-dropdown-list" role="listbox"></ul>
              </div>
            </div>
          </div>
          <!-- Recent folders: one-click destination chips -->
          <div class="picker-quick-row" id="folder-quick-row" role="group" aria-label="Recent folders"></div>
        </div>

        <!-- Shortcut Category Selector with Inline Dropdown (Shown in Shortcut Mode) -->
        <div class="popup-field" id="field-category" style="display: none;">
          <div class="popup-field-header">
            <label class="popup-field-label" for="bm-category-trigger">Category</label>
          </div>
          <div class="picker-trigger-box" id="bm-category">
            <button type="button" class="picker-trigger-btn" id="bm-category-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="picker-trigger-icon-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
              </span>
              <span class="picker-trigger-label" id="bm-category-label">Quick Access</span>
              <svg class="picker-trigger-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <input type="hidden" id="bm-category-value">

            <!-- Inline Category Search & List Dropdown -->
            <div class="picker-dropdown-panel" id="category-dropdown-panel" hidden>
              <div class="picker-dropdown-search-row">
                <svg class="picker-dropdown-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input type="text" class="picker-dropdown-search-input" id="category-search-input" placeholder="Search categories..." autocomplete="off">
                <button type="button" class="picker-dropdown-search-clear" id="category-search-clear" hidden aria-label="Clear search">✕</button>
                <button type="button" class="picker-dropdown-add-btn" id="category-new-btn" title="Create new category">+ New</button>
              </div>

              <!-- Inline New Category Creator -->
              <div class="picker-dropdown-creator" id="category-creator-box" hidden>
                <input type="text" class="picker-dropdown-creator-input" id="category-creator-input" placeholder="Category name..." autocomplete="off">
                <button type="button" class="picker-dropdown-creator-confirm" id="category-creator-confirm">Add</button>
                <button type="button" class="picker-dropdown-creator-cancel" id="category-creator-cancel">✕</button>
              </div>

              <div class="picker-dropdown-list-wrap">
                <ul class="picker-dropdown-list" id="category-dropdown-list" role="listbox"></ul>
              </div>
            </div>
          </div>
          <!-- Recent shortcut categories quick chips -->
          <div class="picker-quick-row" id="category-quick-row" role="group" aria-label="Recent categories"></div>
        </div>

        <!-- Collection Selector with Inline Dropdown (Shown in Collection Mode) -->
        <div class="popup-field" id="field-collection" style="display: none;">
          <div class="popup-field-header">
            <label class="popup-field-label" for="bm-custom-collection-trigger">Collection</label>
          </div>
          <div class="picker-trigger-box" id="bm-custom-collection">
            <button type="button" class="picker-trigger-btn" id="bm-custom-collection-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="picker-trigger-icon-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5Z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
              </span>
              <span class="picker-trigger-label" id="bm-custom-collection-label">Select Collection</span>
              <svg class="picker-trigger-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <input type="hidden" id="bm-custom-collection-value">

            <!-- Inline Collection Dropdown -->
            <div class="picker-dropdown-panel" id="collection-dropdown-panel" hidden>
              <div class="picker-dropdown-search-row">
                <svg class="picker-dropdown-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input type="text" class="picker-dropdown-search-input" id="collection-search-input" placeholder="Search collections..." autocomplete="off">
                <button type="button" class="picker-dropdown-search-clear" id="collection-search-clear" hidden aria-label="Clear search">✕</button>
                <button type="button" class="picker-dropdown-add-btn" id="collection-new-btn" title="Create new collection">+ New</button>
              </div>

              <!-- Inline New Collection Creator -->
              <div class="picker-dropdown-creator" id="collection-creator-box" hidden>
                <input type="text" class="picker-dropdown-creator-input" id="collection-creator-input" placeholder="Collection name..." autocomplete="off">
                <button type="button" class="picker-dropdown-creator-confirm" id="collection-creator-confirm">Add</button>
                <button type="button" class="picker-dropdown-creator-cancel" id="collection-creator-cancel">✕</button>
              </div>

              <div class="picker-dropdown-list-wrap">
                <ul class="picker-dropdown-list" id="collection-dropdown-list" role="listbox"></ul>
              </div>
            </div>
          </div>
          <!-- Recent collections quick chips -->
          <div class="picker-quick-row" id="collection-quick-row" role="group" aria-label="Recent collections"></div>
        </div>

        <!-- Workspace Selector with Inline Dropdown -->
        <div class="popup-field" id="field-workspace">
          <div class="popup-field-header">
            <label class="popup-field-label" for="bm-workspace-trigger">Workspace</label>
          </div>
          <div class="picker-trigger-box" id="bm-workspace">
            <button type="button" class="picker-trigger-btn" id="bm-workspace-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="custom-select-swatch" id="bm-workspace-swatch"></span>
              <span class="picker-trigger-label" id="bm-workspace-label">All Bookmarks</span>
              <svg class="picker-trigger-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <input type="hidden" id="bm-workspace-value">

            <!-- Inline Workspace Dropdown -->
            <div class="picker-dropdown-panel" id="workspace-dropdown-panel" hidden>
              <div class="picker-dropdown-search-row" id="workspace-search-row">
                <svg class="picker-dropdown-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input type="text" class="picker-dropdown-search-input" id="workspace-search-input" placeholder="Search workspaces..." autocomplete="off">
                <button type="button" class="picker-dropdown-search-clear" id="workspace-search-clear" hidden aria-label="Clear search">✕</button>
              </div>

              <div class="picker-dropdown-list-wrap">
                <ul class="picker-dropdown-list" id="workspace-dropdown-list" role="listbox"></ul>
              </div>
            </div>
          </div>
        </div>

        <!-- Hashtags & Suggestions -->
        <div class="popup-field">
          <div class="popup-field-header">
            <label class="popup-field-label" for="bm-tags-input">Tags</label>
            <span class="popup-field-hint">Tap suggested chips or type</span>
          </div>
          <div class="popup-tags-box" id="bm-tags-box">
            <div class="popup-tags-list" id="bm-tags-list"></div>
            <input type="text" id="bm-tags-input" class="popup-tags-input" placeholder="+ tag…" autocomplete="off">
          </div>
        </div>

        <div id="bm-error" class="popup-error-msg" role="status"></div>

        <footer class="popup-footer">
          <button type="submit" id="bm-submit" class="popup-save-btn">
            <svg class="popup-save-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"></path></svg>
            <span id="bm-submit-text">Save Bookmark</span>
          </button>
          <div class="popup-footer-hint">Press <kbd class="popup-kbd">Enter</kbd> to save · <kbd class="popup-kbd">Esc</kbd> to close</div>
        </footer>
      </form>
    </div>
  </div>

  <script type="module" src="popupController.js"></script>
</body>
</html>
